name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or ref to build
        required: true
        type: string
      allow_untagged:
        description: Allow non-release refs for validation artifacts
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            artifact: mythenheim-linux-release-binary
          - platform: windows
            os: windows-latest
            artifact: mythenheim-windows-release-binary
          - platform: macos
            os: macos-latest
            artifact: mythenheim-macos-release-binary

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Rust toolchain
        run: rustup show

      - name: Build release binary
        shell: bash
        run: |
          args=(
            "${{ matrix.platform }}"
            "--repo" "."
            "--ref" "${{ inputs.ref }}"
            "--out-dir" "target/release-binaries"
          )
          if [ "${{ inputs.allow_untagged }}" = "true" ]; then
            args+=("--allow-untagged")
          fi
          python scripts/build_release_binary.py "${args[@]}"

      - name: Upload release binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/release-binaries/*
          if-no-files-found: error
