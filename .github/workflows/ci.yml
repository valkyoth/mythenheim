name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: Format, lint, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - name: Install security tools
        run: |
          cargo install --locked cargo-deny
          cargo install --locked cargo-audit

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Validate release metadata
        run: scripts/validate-release-metadata.sh

      - name: Check Markdown links
        run: perl scripts/check-doc-links.pl

      - name: Validate migrations
        run: cargo run --quiet -- --check-migrations

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Check reduced feature builds
        run: |
          cargo check --no-default-features --features web
          cargo check --no-default-features

      - name: Run local smoke
        run: scripts/smoke_local.sh

      - name: Check dependency policy
        run: cargo deny check

      - name: Check RustSec advisories
        run: cargo audit

  portable-binary:
    name: Binary portability (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux native
            os: ubuntu-latest
            rust-target: ""
            command: cargo test --locked
          - name: Windows native
            os: windows-latest
            rust-target: ""
            command: cargo test --locked
          - name: macOS native
            os: macos-latest
            rust-target: ""
            command: cargo test --locked

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: rustup show

      - name: Install Rust target
        if: matrix.rust-target != ''
        run: rustup target add ${{ matrix.rust-target }}

      - name: Check portable binary
        run: ${{ matrix.command }}
