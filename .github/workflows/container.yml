name: Container

on:
  pull_request:
    branches:
      - main
    paths:
      - Containerfile
      - Cargo.toml
      - Cargo.lock
      - "src/**"
      - "examples/**"
      - .github/workflows/container.yml
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish image to GHCR.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  container:
    name: Build container image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || inputs.publish == true }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="dev-${GITHUB_SHA::12}"
          fi
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${version}"
            echo "${IMAGE_NAME}:sha-${GITHUB_SHA::12}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: ${{ github.event_name == 'push' || inputs.publish == true }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Mythenheim
            org.opencontainers.image.description=Security-first Rust forum platform
            org.opencontainers.image.licenses=EUPL-1.2
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
