name: Feature Request
description: Propose a new Mythenheim capability or roadmap adjustment.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user, moderator, admin, operator, or developer problem should this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the behavior, API, UI, or workflow you want.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Accounts and sessions
        - Forum engine
        - Permissions
        - Moderation
        - Search and notifications
        - Attachments and anti-abuse
        - Admin operations
        - Observability
        - Themes
        - WASM plugins
        - Import/export
        - Deployment
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security and Privacy Impact
      description: Describe auth, permission, data exposure, moderation, plugin, logging, metrics, tracing, or abuse risks.

  - type: textarea
    id: tests
    attributes:
      label: Tests and Finish Line
      description: What tests or smoke checks should prove this is done?
